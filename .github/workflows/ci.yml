name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo +1.91.0 clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.91.0 clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo +1.91.0 test --all-features --locked
      - run: cargo +1.91.0 test --locked --no-default-features
      - run: cargo +1.91.0 doc --no-deps --all-features --locked
      - name: Check protocol-layer isolation
        run: '! rg "crate::(emit|platform|pty|rules|screen|state)" src/osc.rs'
      - name: Check rules and state layering
        run: |
          ! rg 'crate::(pty|platform|emit)' src/rules
          ! rg 'crate::(pty|platform|emit|screen|rules)' src/state.rs
      - run: cargo +1.91.0 package --locked

  android-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.91.0 --profile minimal
      - run: rustup target add --toolchain 1.91.0 aarch64-linux-android
      - run: cargo +1.91.0 check --locked --no-default-features --target aarch64-linux-android

  publish-dry-run:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.91.0 --profile minimal
      - run: cargo +1.91.0 publish --dry-run --locked
