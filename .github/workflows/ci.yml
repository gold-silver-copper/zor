name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - name: Check protocol-layer isolation
        run: '! rg "crate::(emit|platform|pty|rules|screen|state)" src/osc.rs'
      - name: Check rules and state layering
        run: |
          ! rg 'crate::(pty|platform|emit)' src/rules
          ! rg 'crate::(pty|platform|emit|screen|rules)' src/state.rs

  android-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: aarch64-linux-android
      - run: cargo check --locked --no-default-features --target aarch64-linux-android

  publish-dry-run:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - run: cargo publish --dry-run --locked
